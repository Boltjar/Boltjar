# OpenAI GPT-4o over Chat Completions. Needs OPENAI_API_KEY.
# Model page (developers.openai.com/api/docs/models/gpt-4o, read 2026-09-27):
# text and image in, text out, function calling and structured outputs,
# 128,000 token context, 16,384 max output tokens, Chat Completions supported.
# api.openai.com's model list reports none of this, so this file supplies it.
id = "openai/gpt-4o"
provider = "openai"
model = "gpt-4o"
label = "GPT-4o"
summary = "Multimodal chat (text, image), tool-calls and JSON output. Needs OPENAI_API_KEY."
context = 128000
inputs = ["text", "image"]
outputs = ["text"]
tools = true
thinking = false
json = true

[[params]]
name = "temperature"
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.05

[[params]]
name = "top_p"
type = "float"
default = 1.0
min = 0.0
max = 1.0
step = 0.05

[[params]]
name = "max_completion_tokens"
type = "int"
default = 4096
min = 1
max = 16384
