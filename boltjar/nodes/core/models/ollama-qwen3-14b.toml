# Local via Ollama. Qwen3 14B: general text model, thinking + tools, 40k ctx.
# ~9.3 GB, fits a 16 GB GPU. Needs Ollama with `qwen3:14b` pulled.
# Docs: https://ollama.com/library/qwen3 ; https://github.com/ollama/ollama/blob/main/docs/api.md
# Thinking is top-level `think: bool`; JSON via top-level `format: "json"`.
id = "ollama/qwen3:14b"
provider = "ollama"
model = "qwen3:14b"
label = "Qwen3 14B (Ollama)"
summary = "Local 14B text model: thinking + tools, 40k context. Needs Ollama."
context = 40960
inputs = ["text"]
outputs = ["text"]
tools = true
thinking = true
thinking_style = "bool"
json = true

[[params]]
name = "temperature"
type = "float"
default = 0.8
min = 0.0
max = 2.0
step = 0.05

[[params]]
name = "top_p"
type = "float"
default = 0.9
min = 0.0
max = 1.0
step = 0.05

[[params]]
name = "top_k"
type = "int"
default = 20
min = 0
max = 100

[[params]]
name = "num_ctx"
type = "int"
default = 8192
min = 256
max = 40960

[[params]]
name = "keep_alive"
type = "text"
default = "5m"
