# Local via Ollama. Qwen3.5 9B at 8-bit (q8_0): higher quality, vision, 256k ctx.
# ~11 GB, fits a 16 GB GPU. Needs Ollama with `qwen3.5:9b-q8_0` pulled.
# Docs: https://ollama.com/library/qwen3.5 ; https://github.com/ollama/ollama/blob/main/docs/api.md
# Thinking is top-level `think: bool`; JSON via top-level `format: "json"`.
id = "ollama/qwen3.5:9b-q8_0"
provider = "ollama"
model = "qwen3.5:9b-q8_0"
label = "Qwen3.5 9B q8 (Ollama)"
summary = "Local 9B at 8-bit: reads text and images, thinking + tools, 256k context. Needs Ollama."
context = 262144
inputs = ["text", "image"]
outputs = ["text"]
tools = true
thinking = true
thinking_style = "bool"
json = true

[[params]]
name = "temperature"
type = "float"
default = 0.8
min = 0.0
max = 2.0
step = 0.05

[[params]]
name = "top_p"
type = "float"
default = 0.9
min = 0.0
max = 1.0
step = 0.05

[[params]]
name = "top_k"
type = "int"
default = 20
min = 0
max = 100

[[params]]
name = "num_ctx"
type = "int"
default = 8192
min = 256
max = 262144

[[params]]
name = "keep_alive"
type = "text"
default = "5m"
