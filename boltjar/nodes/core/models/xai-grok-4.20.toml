# xAI Grok 4.20, the non-reasoning variant, over the OpenAI-compatible API.
# Needs XAI_API_KEY. Low latency (first sentence in about 1.5 s), a good fit for
# real-time voice chat.
# Model card (docs.x.ai/developers/models/grok-4.20-0309-non-reasoning, read
# 2026-09-23): "text, image -> text", function calling yes, structured outputs
# yes, reasoning no, 1,000,000 token context, $1.25 in / $2.50 out per 1M tokens.
# No thinking, so the node shows no think knob and never sends reasoning_effort.
id = "xai/grok-4.20"
provider = "xai"
model = "grok-4.20-0309-non-reasoning"
label = "Grok 4.20 (xAI, non-reasoning)"
summary = "Fast multimodal chat (text, image), tool-calls and JSON output, no reasoning. Needs XAI_API_KEY."
context = 1000000
inputs = ["text", "image"]
outputs = ["text"]
tools = true
thinking = false
json = true

[[params]]
name = "temperature"
type = "float"
default = 0.9
min = 0.0
max = 2.0
step = 0.05

[[params]]
name = "top_p"
type = "float"
default = 1.0
min = 0.0
max = 1.0
step = 0.05

[[params]]
name = "max_completion_tokens"
type = "int"
default = 2048
min = 1
max = 32768
