# Local via Ollama. Gemma 4 12B is the dense (non-MoE) text+image flagship
# of the Gemma 4 family. Requires Ollama >= 0.30. Pulled with `ollama pull
# gemma4:12b` (~8 GB on disk for q4).
id = "ollama/gemma4:12b"
provider = "ollama"
model = "gemma4:12b"
label = "Gemma 4 12b (Ollama)"
summary = "Local multimodal flagship: reads text and images, thinking + tools. The dense 12B variant."
context = 131072
inputs = ["text", "image"]
outputs = ["text"]
tools = true
thinking = true
thinking_style = "bool"
json = true

[[params]]
name = "temperature"
type = "float"
default = 0.8
min = 0.0
max = 2.0
step = 0.05

[[params]]
name = "top_p"
type = "float"
default = 0.9
min = 0.0
max = 1.0
step = 0.05

[[params]]
name = "num_ctx"
type = "int"
default = 8192
min = 256
max = 131072

[[params]]
name = "keep_alive"
type = "text"
default = "5m"
