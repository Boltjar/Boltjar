# Local via Ollama. Devstral 24B: agentic coding model (top open SWE-Bench),
# 128k ctx, tool-calls, no thinking. ~14 GB, fits a 16 GB GPU.
# Needs Ollama with `devstral` pulled.
# Docs: https://ollama.com/library/devstral ; https://github.com/ollama/ollama/blob/main/docs/api.md
# No thinking; JSON via top-level `format: "json"`.
id = "ollama/devstral"
provider = "ollama"
model = "devstral"
label = "Devstral 24B (Ollama)"
summary = "Local 24B agentic coding model: tool-calls, 128k context. Needs Ollama."
context = 131072
inputs = ["text"]
outputs = ["text"]
tools = true
thinking = false
thinking_style = ""
json = true

[[params]]
name = "temperature"
type = "float"
default = 0.15
min = 0.0
max = 2.0
step = 0.05

[[params]]
name = "top_p"
type = "float"
default = 0.9
min = 0.0
max = 1.0
step = 0.05

[[params]]
name = "top_k"
type = "int"
default = 20
min = 0
max = 100

[[params]]
name = "num_ctx"
type = "int"
default = 8192
min = 256
max = 131072

[[params]]
name = "keep_alive"
type = "text"
default = "5m"
