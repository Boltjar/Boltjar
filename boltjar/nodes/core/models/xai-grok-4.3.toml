# xAI Grok 4.3 over the OpenAI-compatible API. Needs XAI_API_KEY.
# Docs: https://docs.x.ai/docs/api-reference
#       https://docs.x.ai/docs/guides/structured-outputs
# `model` is the exact id the account can serve. grok-4.3 is the unified
# reasoning variant: one model + `reasoning_effort` (none/low/medium/high,
# default low) replaces the old reasoning/non-reasoning split. JSON via
# response_format; set either temperature OR top_p, not both.
id = "xai/grok-4.3"
provider = "xai"
model = "grok-4.3"
label = "Grok 4.3 (xAI)"
summary = "Multimodal chat (text, image) with reasoning, tool-calls and JSON output. Needs XAI_API_KEY."
context = 1000000
inputs = ["text", "image"]
outputs = ["text"]
tools = true
thinking = true
thinking_style = "effort"
json = true

[[params]]
name = "temperature"
type = "float"
default = 0.9
min = 0.0
max = 2.0
step = 0.05

[[params]]
name = "top_p"
type = "float"
default = 1.0
min = 0.0
max = 1.0
step = 0.05

[[params]]
name = "max_completion_tokens"
type = "int"
default = 2048
min = 1
max = 32768
