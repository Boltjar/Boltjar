# Anthropic Claude Sonnet 4.6 over the Messages API. Needs ANTHROPIC_API_KEY.
# Docs: https://platform.claude.com/docs/en/api/messages
#       https://platform.claude.com/docs/en/build-with-claude/extended-thinking
# Sonnet 4.6 supports extended + adaptive thinking and JSON output. May set
# either temperature OR top_p (not both); both exposed as knobs.
id = "anthropic/claude-sonnet-4-6"
provider = "anthropic"
model = "claude-sonnet-4-6"
label = "Claude Sonnet 4.6"
summary = "Balanced reasoning, reads images, tool-calls, extended thinking, JSON output. Needs ANTHROPIC_API_KEY."
context = 1000000
inputs = ["text", "image"]
outputs = ["text"]
tools = true
thinking = true
thinking_style = "level"
json = true

[[params]]
name = "temperature"
type = "float"
default = 1.0
min = 0.0
max = 1.0
step = 0.05

[[params]]
name = "max_tokens"
type = "int"
default = 4096
min = 1
max = 64000

[[params]]
name = "top_p"
type = "float"
default = 0.999
min = 0.0
max = 1.0
step = 0.001
