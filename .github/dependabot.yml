version: 2
# Minor and patch updates only: majors are upgraded by hand, so every ecosystem
# ignores semver-major. A security update skips that rule, which is why mcp also
# ignores 2.x by version range (see its pin in requirements.txt).
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    # a range in requirements.txt changes only when a release falls outside it;
    # the minimum versions stay as low as the code allows.
    versioning-strategy: increase-if-necessary
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: mcp
        versions: [">=2"]
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /editor
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
