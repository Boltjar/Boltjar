version: 2
# Security updates only: a PR opens when a dependency has a known vulnerability
# (Dependabot security updates are on in the repository settings). Routine
# version updates are off (open-pull-requests-limit: 0); dependencies are
# upgraded by hand. mcp ignores 2.x by version range (see its pin in
# requirements.txt), since a security update skips the semver-major rule.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: deps
    # a range in requirements.txt changes only when a release falls outside it;
    # the minimum versions stay as low as the code allows.
    versioning-strategy: increase-if-necessary
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: mcp
        versions: [">=2"]
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /editor
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: deps
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: ci
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
